name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version without v prefix (for example 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease (recommended until release gates pass)'
        type: boolean
        default: true

permissions:
  contents: read

# Never interrupt publication midway or allow two releases to race.
concurrency:
  group: hostlight-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HOSTLIGHT_TRAY_SMOKE: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate release request
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run Publish release from main.' }
          . ./scripts/release-tools.ps1
          $version = ConvertTo-ReleaseVersion $env:REQUESTED_VERSION
          $refs = gh api "repos/$env:GH_REPO/git/matching-refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          if (@($refs | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/v$version" }).Count -gt 0) {
            throw 'This version already exists. Releases never move or overwrite existing tags.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install matching Wails CLI
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Wails version.' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Wails.' }
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify before packaging
        run: ./scripts/verify.ps1 -SkipDesktopBuild
      - name: Build versioned release archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - name: Ensure build metadata was restored
        run: |
          git diff --exit-code -- wails.json go.mod go.sum frontend/package.json frontend/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaging changed committed build/dependency metadata.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            build/bin/release/${{ steps.version.outputs.version }}/*.zip
            build/bin/release/${{ steps.version.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          # Check again immediately before publication; never move an existing tag.
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then echo 'Version already exists; refusing to overwrite.' >&2; exit 1; fi
          (cd packages && sha256sum -c SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          Windows amd64 standalone build. Extract the ZIP and run `Hostlight/hostlight.exe`.

          Microsoft Edge WebView2 Runtime is required. Settings remain in `%APPDATA%\Hostlight`; this is not portable-data or Windows-service mode.

          **Unsigned build:** Windows SmartScreen may warn. Verify the ZIP against `SHA256SUMS.txt` and download only from this project's release page.

          Release gates, including fresh-machine, upgrade/uninstall, load/soak, and signing checks, remain separate from automated tests.
          NOTES
          # Atomically create the tag on GitHub at the tested SHA. If another
          # publisher created it after our check, fail instead of reusing it.
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          args=(--repo "$GH_REPO" --verify-tag --title "Hostlight $tag" --draft --notes-file release-notes.md)
          if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          # Upload into a draft first. A failed upload must not publish partial assets.
          gh release create "$tag" packages/*.zip packages/SHA256SUMS.txt "${args[@]}"
          gh release edit "$tag" --repo "$GH_REPO" --draft=false
