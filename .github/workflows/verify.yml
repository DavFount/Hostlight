name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tests and desktop build
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      # Hosted CI is not an interactive desktop. Native tray smoke is opt-in locally.
      HOSTLIGHT_TRAY_SMOKE: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install matching Wails CLI
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Wails module version.' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Wails.' }
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify formatting, tests, static checks, and build
        run: ./scripts/verify.ps1
      - name: Check dependency files remained unchanged
        run: |
          git diff --exit-code -- go.mod go.sum frontend/package.json frontend/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Verification changed committed dependency files.' }
      - name: Upload unsigned verification build
        uses: actions/upload-artifact@v4
        with:
          name: hostlight-windows-amd64-verification
          path: build/bin/hostlight-verify.exe
          if-no-files-found: error
          retention-days: 7
